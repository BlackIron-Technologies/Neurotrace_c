name: Build Backend Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Backend release version
        required: true
        default: '1.3.4'
      create_release:
        description: Publish verified release assets
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            architecture: x64
          - platform: linux
            runner: ubuntu-22.04
            architecture: x64
          - platform: macos
            runner: macos-15
            architecture: arm64
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compilation/requirements-backend.txt
      - name: Verify requested version
        run: |
          python - <<'PY'
          import os, subprocess, sys
          version = subprocess.check_output([sys.executable, 'bin/neurotrace.py', '--version'], text=True).strip()
          assert version == os.environ['RELEASE_VERSION'], (version, os.environ['RELEASE_VERSION'])
          PY
      - name: Install pinned dependencies
        run: |
          python -m pip install -r compilation/requirements-backend.txt
          python -m pip install pyinstaller==6.14.0
      - name: Test backend contracts and lifecycle
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch pinned embedding model
        shell: pwsh
        run: ./compilation/fetch-onnx-model.ps1
      - name: Build native executable
        working-directory: compilation
        run: python -m PyInstaller --noconfirm --clean neurotrace.spec
      - name: Sign macOS executable
        if: matrix.platform == 'macos'
        run: codesign --deep --force --sign - compilation/dist/neurotrace/neurotrace
      - name: Set executable test path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          name = 'neurotrace.exe' if os.name == 'nt' else 'neurotrace'
          path = (Path('compilation/dist/neurotrace') / name).resolve()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('NEUROTRACE_TEST_EXECUTABLE=' + str(path) + '\n')
          PY
      - name: Test native executable
        run: |
          python compilation/test_executable.py "$NEUROTRACE_TEST_EXECUTABLE"
          python -m unittest discover -s tests -p 'test_runtime_lifecycle.py' -v
          python tests/packaged_host_smoke.py
          python tests/mcp_backend_smoke.py
          python tests/mcp_repository_smoke.py
      - name: Generate third-party notices
        shell: pwsh
        run: ./compilation/generate-backend-notices.ps1 -DistributionPath ./compilation/dist/neurotrace
      - name: Package and verify native archive
        run: python compilation/package_backend.py build --directory compilation/dist/neurotrace --output releases --version "$RELEASE_VERSION" --platform "$TARGET_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ inputs.version }}-${{ matrix.platform }}
          path: releases/neurotrace-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    name: Verify release packages
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-${{ inputs.version }}-*
          merge-multiple: true
          path: releases
      - name: Verify archives and generate checksums
        run: python compilation/package_backend.py verify --directory releases --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: releases/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish release from the tested commit
        if: inputs.create_release
        run: |
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NeuroTrace backend $RELEASE_VERSION" \
            --notes 'Native backends: Windows x64, Linux x64, and macOS Apple Silicon (arm64). Each executable and archive passed native acceptance checks. Existing 1.1.6 release assets are unchanged.' \
            releases/neurotrace-windows.zip releases/neurotrace-linux.zip releases/neurotrace-macos.zip releases/SHA256SUMS.txt
