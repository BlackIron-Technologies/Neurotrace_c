services:
  neurotrace-sync:
    build:
      context: ..
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9473:9473"
    environment:
      NEUROTRACE_SYNC_SETUP_KEY: ${NEUROTRACE_SYNC_SETUP_KEY:?Set a strong one-time setup key}
    volumes:
      - neurotrace-sync:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9473/v1/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  neurotrace-sync:
